# Arma PDF Studio para Windows desde el código del repo y publica el release.
#
# Se dispara al crear un tag v* (por ejemplo v0.2.0) o a mano desde la pestaña Actions.
# A mano arma y prueba todo, pero NO publica: las notas quedan en el resumen de la corrida.
# Las notas del release salen de la sección de CHANGELOG.md de la versión del tag, más los
# pasos de instalación (herramientas/notas_release.py). Si esa sección falta, falla enseguida.
# Reproducible: Python, paquetes (requirements-empaquetado.txt) y acciones con versión fija
# (las acciones por SHA de commit); PYTHONHASHSEED=0 y SOURCE_DATE_EPOCH = fecha del commit.
#
# Firma con SignPath Foundation: preparada pero DESACTIVADA hasta que aprueben el proyecto.
# Para activarla (Settings → Secrets and variables → Actions), ver CODE_SIGNING.md:
#   Variables:  SIGNPATH_HABILITADO = true
#               SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG,
#               SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
#   Secreto:    SIGNPATH_API_TOKEN
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión para armar las notas (por ejemplo v0.2.0). Vacío: la de pyproject.toml."
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.13"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: "utf-8"

jobs:
  armar:
    runs-on: windows-latest
    permissions:
      contents: write          # publicar el release
      actions: read            # SignPath descarga el artefacto de esta corrida
    steps:
      - name: Código del tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Notas del release (sección del CHANGELOG.md + instalación)
        shell: pwsh
        env:
          VERSION_MANUAL: ${{ inputs.version }}
          ES_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REF_NAME: ${{ github.ref_name }}
          FIRMADO: ${{ vars.SIGNPATH_HABILITADO }}
        run: |
          $tag = if ($env:ES_TAG -eq "true") { $env:REF_NAME }
                 elseif ($env:VERSION_MANUAL) { $env:VERSION_MANUAL }
                 else { "v" + (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])") }
          $opciones = @("--salida", "notas-release.md")
          if ($env:FIRMADO -eq "true") { $opciones += "--firmado" }
          python herramientas/notas_release.py $tag @opciones
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "## Notas del release $tag`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content notas-release.md -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Fecha fija para los archivos (la del commit)
        shell: pwsh
        run: |
          $epoca = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$epoca" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Dependencias con versión fija
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements-empaquetado.txt

      - name: Pruebas
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not red"

      - name: Armar el .exe y probarlo (autoprueba)
        shell: pwsh
        run: python herramientas/empaquetar.py --sin-zip --sin-ventana

      - name: Subir la carpeta sin firmar
        id: sin-firmar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: PDFStudio-sin-firmar
          path: dist/PDF Studio/
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------------- firma (desactivada)
      - name: Firmar con SignPath Foundation
        if: ${{ vars.SIGNPATH_HABILITADO == 'true' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627   # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmado

      - name: Comprobar la firma
        if: ${{ vars.SIGNPATH_HABILITADO == 'true' }}
        shell: pwsh
        run: |
          $firma = Get-AuthenticodeSignature "firmado/PDFStudio/PDFStudio.exe"
          if ($firma.Status -ne "Valid") { throw "La firma del .exe no es válida: $($firma.Status)" }
          $firma.SignerCertificate | Format-List Subject, Issuer, NotAfter

      # ---------------------------------------------------------------- ZIP y release
      - name: ZIP (firmado si la firma está activada)
        shell: pwsh
        run: |
          $carpeta = if ("${{ vars.SIGNPATH_HABILITADO }}" -eq "true") { "firmado" } else { "dist/PDF Studio" }
          python herramientas/empaquetar.py --zip-desde $carpeta

      - name: Publicar el release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem dist/PDFStudio-*-windows.zip | Select-Object -First 1
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip.FullName dist/SHA256SUMS.txt --clobber
            gh release edit $tag --notes-file notas-release.md
          } else {
            gh release create $tag $zip.FullName dist/SHA256SUMS.txt --verify-tag --title "PDF Studio $($tag.TrimStart('v'))" --notes-file notas-release.md
          }
